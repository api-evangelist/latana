x-coverage:
  state: none
  reason: no-developer-program
  detail: >-
    Latana ships brand tracking only as an end-user product — a dashboard, a CSV export and a
    Slack bot the Customer Success team provisions by email — with no developer program of any
    kind: /developers, /api and /integrations all 404, and the sitemap has no developer page.
    A private Rails backend does exist at back.latana.com and mounts an API reference at
    /api-docs, but it is protected by HTTP Basic authentication and is never offered, priced
    or documented as a customer-facing API, so it is an internal application backend rather
    than a withheld API product.
