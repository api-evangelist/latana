x-tier-reason: >-
  Re-probed 2026-08-12 with a wider host set than the 2026-07-19 round. Still no public
  developer surface: api./docs./developer./developers./status./trust./security./mcp.
  subdomains do not resolve, no /.well-known/ document is served on ANY Latana host, no
  /llms.txt, no OpenAPI, GraphQL SDL, AsyncAPI, MCP server, agent card, SDK, CLI or public
  Postman collection, and the 59-URL sitemap contains no developer or API page. Three
  previously unknown Latana hosts were recovered from the app.latana.com JavaScript bundle
  (back.latana.com, llmagent.latana.com, resources.latana.com) and probed: back.latana.com is
  the dashboard's private Rails backend and returns HTTP 401 (WWW-Authenticate: Basic) on
  /api-docs, and its /mcp path is a generic JSON-RPC router that answers -32601 to tools/list,
  not an MCP server. No contract was reconstructed from private application traffic.
  Enterprise SaaS delivered via dashboard, CSV export and a CS-provisioned Slack app.
