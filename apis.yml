aid: latana
name: Latana
description: >-
  Latana is a Berlin-based brand tracking and consumer-insights platform that measures brand
  awareness, brand perception, purchase consideration and ad awareness for global consumer
  brands. Rather than buying responses from incentivized survey panels, Latana collects
  non-incentivized micro-surveys through advertising placements to reach everyday consumers,
  then applies Bayesian modelling and machine-learning quality assurance to project the
  sample onto real-world populations, including small and hard-to-reach markets. The product
  is delivered as a dashboard covering brand health tracking, competitor benchmarking,
  purchase funnel tracking and brand strategy planning, sold per market per year across
  Essential, Pro and Custom tiers. Customers include Unilever, Amazon, IKEA, Uber, PVH and
  Emma Sleep. Latana is backed by Balderton Capital. As of August 2026 Latana publishes no
  public API, developer portal, SDKs or machine-readable API description; delivery is through
  the app.latana.com dashboard, CSV export and a Latana Slack app whose access the Customer
  Success team provisions on request. A private Rails backend at back.latana.com serves the
  dashboard over /api/v2 and /api/v3 and mounts an API reference at /api-docs behind HTTP
  Basic authentication, and an LLM surface at llmagent.latana.com backs the in-product data
  assistant, but neither is documented, marketed or offered to customers as an API product.
