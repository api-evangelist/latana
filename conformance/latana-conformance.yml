notes: >-
  Latana publishes NO named security certification. /security, /trust and /compliance all
  return 404, trust.latana.com and security.latana.com do not resolve, and the privacy policy
  names no ISO 27001, SOC 2, TISAX, CSA STAR or PCI programme. The only compliance framework
  Latana asserts is GDPR, which it invokes repeatedly by article in its privacy policy as the
  legal basis for processing — appropriate for a Berlin GmbH whose product is survey data
  about EU consumers, but a statutory obligation rather than an audited certification.
  Because no certification programme is published, NO `Compliance` pointer is wired in
  apis.yml: emitting one here would credit Latana with an audited posture it does not claim.
  Every API-shaped standard below is `false` for the same underlying reason — Latana publishes
  no machine-readable contract to conform to.
standards:
