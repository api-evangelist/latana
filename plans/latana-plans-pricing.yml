notes: >-
  Latana publishes real, named, numerically-priced tiers on its public pricing page — unusual
  for enterprise brand-tracking software, and the reason this artifact is `searched` rather
  than a "contact us" zero. Pricing is per MARKET per YEAR, not per seat: users are unlimited
  on every tier and the billable unit is the country/market being tracked. There is no API,
  call-volume or data-export component to any tier — the quota unit is interviews collected
  per brand per market per year. Contract minimum is 12 months; trial access is offered
  without an annual commitment.
